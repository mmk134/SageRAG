name: sagerag

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sagerag-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sagerag}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - sagerag-pgdata:/var/lib/postgresql/data
      - ./resources/database/schema_pg.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./resources/database/init_data_pg.sql:/docker-entrypoint-initdb.d/02-init-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sagerag}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sagerag-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-123456}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - sagerag-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rocketmq-namesrv:
    image: apache/rocketmq:5.2.0
    container_name: sagerag-rmqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx400m"
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'The Name Server boot success' /home/rocketmq/logs/rocketmqlogs/namesrv.log || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  rocketmq-broker:
    image: apache/rocketmq:5.2.0
    container_name: sagerag-rmqbroker
    environment:
      NAMESRV_ADDR: "rocketmq-namesrv:9876"
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    command:
      - sh
      - -c
      - |
        cat > /home/rocketmq/rocketmq-5.2.0/conf/broker.conf << EOF
        brokerClusterName = DefaultCluster
        brokerName = broker-a
        brokerId = 0
        deleteWhen = 04
        fileReservedTime = 48
        brokerRole = ASYNC_MASTER
        flushDiskType = ASYNC_FLUSH
        brokerIP1 = 127.0.0.1
        timerMaxDelaySec = 31622400
        EOF
        sh mqbroker --enable-proxy -c /home/rocketmq/rocketmq-5.2.0/conf/broker.conf
    restart: unless-stopped

  # 可选：对象存储。默认使用本地磁盘；需要 S3 时设置 STORAGE_TYPE=s3 并启用该 profile。
  # docker compose --profile s3 up -d
  minio:
    image: minio/minio:latest
    container_name: sagerag-minio
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-rustfsadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-rustfsadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sagerag-miniodata:/data
    restart: unless-stopped

volumes:
  sagerag-pgdata:
  sagerag-redisdata:
  sagerag-miniodata:
