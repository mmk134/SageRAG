server:
  port: 9090
  servlet:
    context-path: /api/sagerag

spring:
  application:
    name: sagerag${unique-name:}-service
  config:
    # 支持从项目根目录的 .env 读取本地配置（不提交到 Git）
    import: optional:file:./.env[.properties]

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  datasource:
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sagerag}?client_encoding=UTF8
    hikari:
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: SageRAGHikariPool

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: sagerag-producer${unique-name:}_pg
    send-message-timeout: 2000

rag:
  vector:
    # 仅使用 PostgreSQL + pgvector，避免额外维护一套向量数据库
    type: pg

  storage:
    # local：本地磁盘（默认，零额外组件）；s3：兼容 S3 的对象存储（如 RustFS / MinIO）
    type: ${STORAGE_TYPE:local}
    local-root: ${STORAGE_LOCAL_ROOT:./data/uploads}

  default:
    collection-name: rag_default_store
    dimension: ${EMBEDDING_DIMENSION:1024}
    metric-type: COSINE
    sse-timeout-ms: 300000

  query-rewrite:
    enabled: true

  rerank:
    enabled: true

  rate-limit:
    global:
      enabled: true
      max-concurrent: 10
      max-wait-seconds: 15
      lease-seconds: 30
      poll-interval-ms: 200

  memory:
    history-keep-turns: 4
    summary-start-turns: 5
    summary-enabled: true
    summary-max-chars: 200
    title-max-length: 30

  semaphore:
    document-upload:
      name: rag:document:upload
      max-concurrent: 10
      max-wait-seconds: 5
      lease-seconds: 300

  knowledge:
    schedule:
      scan-delay-ms: 10000
      lock-seconds: 900
      batch-size: 20
      min-interval-seconds: 60

  mcp:
    servers:
      - name: default
        url: ${MCP_SERVER_URL:http://localhost:9099}

  search:
    channels:
      vector-global:
        confidence-threshold: 0.6
        top-k-multiplier: 3
      intent-directed:
        enabled: true
        min-intent-score: 0.4
        top-k-multiplier: 2

  trace:
    enabled: true
    max-error-length: 1000

ai:
  providers:
    ollama:
      url: ${OLLAMA_BASE_URL:http://localhost:11434}
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
    bailian:
      url: https://dashscope.aliyuncs.com
      api-key: ${BAILIAN_API_KEY:}
      endpoints:
        chat: /compatible-mode/v1/chat/completions
        embedding: /compatible-mode/v1/embeddings
        rerank: /api/v1/services/rerank/text-rerank/text-rerank
    siliconflow:
      url: https://api.siliconflow.cn
      api-key: ${SILICONFLOW_API_KEY:}
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings

  selection:
    failure-threshold: 2
    open-duration-ms: 30000

  stream:
    message-chunk-size: 1

  chat:
    default-model: qwen3.8-max-0902
    deep-thinking-model: qwen3.8-max-0902
    candidates:
      - id: qwen3.8-max-0902
        provider: bailian
        model: qwen3.8-max-0902
        supports-thinking: true
        priority: 1
      - id: qwen-plus
        provider: bailian
        model: qwen-plus-latest
        priority: 2
      - id: glm-4.7
        provider: siliconflow
        model: Pro/zai-org/GLM-4.7
        supports-thinking: true
        priority: 3

  embedding:
    default-model: qwen3.7-text-embedding-flash
    candidates:
      - id: qwen3.7-text-embedding-flash
        provider: bailian
        model: qwen3.7-text-embedding-flash
        dimension: ${rag.default.dimension}
        priority: 1
      - id: qwen-emb-8b
        provider: siliconflow
        model: Qwen/Qwen3-Embedding-8B
        dimension: ${rag.default.dimension}
        priority: 2

  rerank:
    default-model: qwen3.7-text-rerank
    candidates:
      - id: qwen3.7-text-rerank
        provider: bailian
        model: qwen3.7-text-rerank
        priority: 1
      - id: rerank-noop
        provider: noop
        model: noop
        priority: 100

# 仅在 rag.storage.type=s3 时生效
rustfs:
  url: ${S3_ENDPOINT:http://localhost:9000}
  access-key-id: ${S3_ACCESS_KEY:rustfsadmin}
  secret-access-key: ${S3_SECRET_KEY:rustfsadmin}

sa-token:
  token-name: Authorization
  timeout: 2592000
  is-concurrent: true
  is-share: false
  token-style: simple-uuid
  is-log: false
  is-print: false

app:
  demo-mode: false
  eval:
    enabled: true
